<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: oklch(0.10 0.015 240); }
    .fg { fill: oklch(0.91 0.005 240); }
    @media (prefers-color-scheme: light) {
      .bg { fill: oklch(0.87 0.01 240); }
      .fg { fill: oklch(0.10 0.015 240); }
    }
  </style>
  <!-- Background -->
  <rect width="32" height="32" rx="3" class="bg"/>
  <!-- N: left stem, diagonal, right stem -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="17"
    letter-spacing="-0.5"
    class="fg"
  >NK</text>
</svg>
